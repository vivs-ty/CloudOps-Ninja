# Gitleaks Configuration for Secret Detection
# https://github.com/gitleaks/gitleaks

title = "gitleaks config"

[allowlist]
description = "global allow lists"
paths = [
    '''go\.sum''',
    '''go\.mod''',
    '''vendor/''',
    '''\.gitleaks\.toml''',
    '''test.*''',
    '''\.env\.example''',
    '''terraform\.tfvars\.example''',
    '''\.md$''',
    '''\.txt$''',
    '''\.yml$''',
    '''\.yaml$''',
    '''\.json$''',
    '''\.xml$''',
    '''\.log$''',
    '''logs/''',
    '''\.git/''',
    '''node_modules/''',
    '''\.pytest_cache/''',
    '''__pycache__/''',
    '''\.terraform/''',
    '''\.vscode/''',
    '''\.github/''',
]

# Allow test files and documentation
regexes = [
    '''(?i)test.*password''',
    '''(?i)example.*key''',
    '''(?i)sample.*secret''',
    '''(?i)dummy.*token''',
    '''(?i)fake.*credential''',
    '''(?i)mock.*secret''',
    '''(?i)placeholder.*key''',
]

# Custom rules for common secrets
[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)aws_access_key_id\s*[:=]\s*['"]?([A-Z0-9]{20})['"]?'''
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_secret_access_key\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})['"]?'''
tags = ["aws", "key"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''(?i)github.*token\s*[:=]\s*['"]?(ghp_[a-zA-Z0-9]{36})['"]?'''
tags = ["github", "token"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key patterns"
regex = '''(?i)api[_-]?key\s*[:=]\s*['"]?([a-zA-Z0-9_-]{20,})['"]?'''
tags = ["api", "key"]

[[rules]]
id = "database-password"
description = "Database password patterns"
regex = '''(?i)(db|database|sql|postgres|mysql).*password\s*[:=]\s*['"]?([^'"\s]{8,})['"]?'''
tags = ["database", "password"]

[[rules]]
id = "private-key"
description = "Private key patterns"
regex = '''-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "dockerhub-token"
description = "Docker Hub token"
regex = '''(?i)docker.*token\s*[:=]\s*['"]?([a-zA-Z0-9_-]{20,})['"]?'''
tags = ["docker", "token"]

# Extend default rules
[extend]
# Use default gitleaks rules plus our custom ones
useDefaultRules = true